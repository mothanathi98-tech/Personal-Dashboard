name: Cloudflare Next.js compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "components/**"
      - "features/**"
      - "lib/**"
      - "next.config.ts"
      - "package.json"
      - "package-lock.json"
      - "proxy.ts"
      - "tsconfig.json"
      - ".github/workflows/cloudflare-compatibility.yml"

permissions:
  contents: read

jobs:
  vinext-compatibility:
    name: Check Next.js compatibility with vinext
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check vinext compatibility
        run: npx --yes vinext check
